<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Split-Screen</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main>
        
        <section id="ilustrasi">
            <div>
                <h1>Fabian's Creative Space.</h1>
                <p>Welcome to my creative space!</p>
            </div>
        </section>

        <section id="formulir">
            <div>
                <h2>Sign In</h2>
                <p class="sub-judul">Silakan masuk ke akun Anda.</p>

                <button type="button" aria-label="Sign in with Google">
                    <strong>G</strong> Sign in with Google
                </button>

                <div class="pemisah">
                    <span>or</span>
                </div>

                <form action="#" method="POST">
                    
                    <label for="user-email">Email / Username</label>
                    <input type="text" id="user-email" name="user-email" placeholder="Masukkan email" required>

                    <div class="label-grup">
                        <label for="user-pass">Password</label>
                        <a href="#" class="lupa-pass">Forgot Password?</a>
                    </div>
                    <input type="password" id="user-pass" name="user-pass" placeholder="Masukkan password" required>

                    <div class="ingat-grup">
                        <input type="checkbox" id="ingat-saya" name="ingat-saya">
                        <label for="ingat-saya" class="ingat">Remember Me</label>
                    </div>

                    <button type="submit">Sign In</button>
                    
                </form>
            </div>
        </section>

    </main>

</body>
</html>
